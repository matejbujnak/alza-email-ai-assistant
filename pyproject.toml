[project]
name = "alza-email-ai-assistant"
version = "0.1.0"
description = "Email-based AI assistant that replies to incoming emails using Gemini."
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=3.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Gemini API (run with: uv run pytest -m live -s)"]
filterwarnings = ["ignore::SyntaxWarning"]
